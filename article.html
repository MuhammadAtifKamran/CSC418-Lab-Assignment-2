<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — The Current</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-top">
      <a href="index.html" class="wordmark">THE <span>CURRENT</span></a>
      <div class="dateline">
        <span class="dot"></span>
        <span class="txt">EDITION LIVE</span>
      </div>
    </div>
  </header>

  <a href="index.html" class="back-link">← Back to front page</a>

  <article>
    <div class="article-header">
      <span id="article-tag" class="tag">Category</span>
      <h1 id="article-title">Loading story…</h1>
      <p class="article-excerpt" id="article-excerpt"></p>
      <div class="article-meta-row">
        <span>By <b id="article-author"></b></span>
        <span id="article-date"></span>
        <span id="article-readtime"></span>
      </div>
    </div>

    <div class="article-hero-media">
      <img id="article-hero-img" src="" alt="">
    </div>

    <div class="article-body" id="article-body"></div>
  </article>

  <section class="section" id="related-section">
    <h3 class="related-heading">More in this category</h3>
    <div class="related-grid" id="related-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span class="wordmark">THE <span style="color:var(--accent)">CURRENT</span></span>
      <span class="footer-meta">© 2026 The Current — Independent News & Culture. All stories are original editorial content.</span>
    </div>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
